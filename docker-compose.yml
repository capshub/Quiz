services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS: "1"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_BACKUP_DIR: /app/data/backups
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
